name: Build dist for Timeweb

# Keeps the `timeweb` branch updated with the built site (index.html + assets),
# so it can be downloaded as ZIP and uploaded to shared hosting — no terminal.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Push dist to timeweb branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git checkout --orphan timeweb-tmp
          # Clean untracked files FIRST, while .gitignore still applies
          # (otherwise node_modules gets committed).
          git clean -fdx -e dist
          git rm -rf .
          mv dist/* .
          rmdir dist
          # Safety net: never commit dependency folders even if clean missed them.
          git rm -r --cached node_modules package-lock.json 2>/dev/null || true
          rm -rf node_modules package-lock.json
          git add -A
          echo "Files in snapshot:"; git ls-files | head -20
          git commit -m "timeweb dist $GITHUB_SHA" || echo "no changes"
          git branch -D timeweb || true
          git branch -m timeweb
          git push -f origin timeweb
